# The library commit whose plugin/hooks/ tree this plugin vendors.
# CI diffs hooks/ against that SHA byte for byte, with no transforms at all -- unlike
# skill.lock, which allows exactly one line.
# host= names the record in hooks/hosts/ that this repository binds. OpenCode registers a
# JavaScript module rather than a generated manifest, so unlike the shell hosts there is
# no hooks.json here and nothing generates one; tools/generate.py refuses this host by
# name for exactly that reason.
repo=memvara/memvara
sha=e0552014652efe3b998d9ae7367c073c9a9f1f83
path=plugin/hooks
host=opencode
